<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Campminder Brand Ad Templates — Studio Parkside</title>
<style>
  :root {
    --ground: #F0F1F2;
    --card: #FFFFFF;
    --ink: #000000;
    --ink-soft: #5B5D5F;
    --ink-muted: #676A6D;
    --outline: #E2E4E6;
    --hairline: #E9EAEC;
    --radius: 28px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
    font-size: 19px;
    line-height: 1.62;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding: 12px;
    min-height: 100vh;
    display: flex;
    align-items: center;
  }

  .stack { max-width: 760px; width: 100%; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--outline);
    border-radius: var(--radius);
    padding: 56px 48px 40px;
  }

  h1 {
    font-size: 40px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-weight: 620;
  }

  .sub { color: var(--ink-muted); font-size: 17px; margin-top: 10px; }

  .rows { margin-top: 40px; }

  .row {
    display: flex;
    align-items: baseline;
    gap: 20px;
    padding: 20px 0;
    border-top: 1px solid var(--hairline);
    text-decoration: none;
    color: var(--ink);
    transition: border-color 140ms ease;
  }
  .row:last-child { border-bottom: 1px solid var(--hairline); }
  a.row:hover { border-top-color: var(--ink); }
  a.row:last-child:hover { border-bottom-color: var(--ink); }

  .num {
    font-variant-numeric: tabular-nums;
    color: var(--ink-muted);
    font-size: 15px;
    min-width: 28px;
  }

  .label { flex: 1; font-weight: 560; }

  .note { color: var(--ink-muted); font-size: 15px; }

  .arrow { font-size: 15px; color: var(--ink-muted); transition: transform 140ms ease; }
  a.row:hover .arrow { transform: translate(2px, -2px); }

  .row.pending { color: var(--ink-muted); }
  .row.pending .label { font-weight: 400; }

  .foot { margin-top: 32px; color: var(--ink-muted); font-size: 15px; }

  @media (max-width: 640px) {
    body { align-items: flex-start; }
    .card { padding: 40px 26px 28px; }
    h1 { font-size: 30px; }
    .note { display: none; }
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="card">
      <h1>Campminder</h1>
      <p class="sub">Brand Ad Templates</p>

      <div class="rows">
        <a class="row" href="https://proposal.studioparkside.co/campminder-brand-ad-templates/">
          <span class="num">01</span>
          <span class="label">Proposal</span>
          <span class="note">Sent 9/22</span>
          <span class="arrow">&#8599;</span>
        </a>
        <a class="row" href="kickoff/">
          <span class="num">02</span>
          <span class="label">Kickoff</span>
          <span class="note">Shared 00/00</span>
          <span class="arrow">&#8599;</span>
        </a>
        <div class="row pending">
          <span class="num">03</span>
          <span class="label">Walkthrough</span>
          <span class="note"></span>
          <span class="arrow"></span>
        </div>
      </div>

      <p class="foot">Studio Parkside</p>
    </div>
  </div>
</body>
</html>
