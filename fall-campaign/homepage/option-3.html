<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>Campminder Homepage — Option 3</title>
<style>
/* ─────────────────────────────────────────────
   Campminder Fall Campaign — Homepage, option 3
   Gradient hero, cropped platform components. Each card is a window onto
   one panel of the dashboard. The row is static here. It could slide to
   the left on scroll, which is why the full set of six sits in the track
   rather than only the three that show.

   Hero only. Everything below this section is the same page as
   homepage.html, so it is not repeated here.

   Fixed 1440 canvas, built to run inside the window card on index.html.
   Studio Parkside, August 2026
   ⚠ Every date and every number on the cards is product data from the
   enrollment dashboard prototype, standing in for a screenshot.
───────────────────────────────────────────── */

@font-face { font-family:"General Sans"; src:url("fonts/GeneralSans-Regular.woff2") format("woff2"); font-weight:400; font-display:block; }
@font-face { font-family:"General Sans"; src:url("fonts/GeneralSans-Medium.woff2") format("woff2"); font-weight:500; font-display:block; }
@font-face { font-family:"General Sans"; src:url("fonts/GeneralSans-Semibold.woff2") format("woff2"); font-weight:600; font-display:block; }
@font-face { font-family:"General Sans"; src:url("fonts/GeneralSans-Bold.woff2") format("woff2"); font-weight:700; font-display:block; }
@font-face { font-family:"Spezia Narrow"; src:url("fonts/SpeziaNarrowWeb_TEST-FONT_Medium.woff2") format("woff2"); font-weight:500; font-display:block; }
@font-face { font-family:"Spezia Narrow"; src:url("fonts/SpeziaNarrowWeb_TEST-FONT_SemiBold.woff2") format("woff2"); font-weight:600; font-display:block; }
@font-face { font-family:"Spezia Narrow"; src:url("fonts/SpeziaNarrowWeb_TEST-FONT_Bold.woff2") format("woff2"); font-weight:700; font-display:block; }

:root {
  --sans: "General Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --disp: "Spezia Narrow", "General Sans", sans-serif;
  --canvas: #0d0a16;
  --ink: #ffffff;
  --body: #e7e3f0;
  --mid: #a79cbd;
  --hair: rgba(255,255,255,0.10);
  --dark: #27065c;
  --pad: 34px;
  --rgut: 210px;
  --radius: 20px;
  --radius-sm: 12px;
  --radius-pill: 999px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--canvas); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
img, svg { display: block; }
a { text-decoration: none; color: inherit; }

.hp { width: 1440px; margin: 0 auto; position: relative; background: var(--canvas);
  font-family: var(--sans); color: var(--body); font-size: 16.5px; line-height: 1.58; }
h1 { font-family: var(--disp); font-weight: 700; color: var(--ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; font-size: 14.5px;
  font-weight: 500; letter-spacing: -0.005em; white-space: nowrap; border: 1px solid transparent;
  border-radius: var(--radius-pill); }
.btn.solid { background: #fff; color: #14101f; }
.btn.line { background: rgba(255,255,255,0.10); color: #fff; border-color: rgba(255,255,255,0.46); }

/* ═══════════ NAV ═══════════ */
.nav { height: 70px; display: flex; align-items: center; padding: 0 24px 0 var(--pad);
  border-bottom: 1px solid var(--hair); position: relative; z-index: 40; }
.nav .mark { width: 135px; }
.nav .links { display: flex; gap: 30px; margin-left: 30px; }
.nav .links a, .nav .login { font-size: 14.5px; font-weight: 500; letter-spacing: -0.005em; color: var(--mid); }
.nav .right { margin-left: auto; display: flex; align-items: center; gap: 30px; }
.nav .btn { height: 39px; padding: 0 20px; }

/* ═══════════ STICKY RAIL ═══════════ */
.railgutter { position: absolute; top: 70px; right: 0; bottom: 0; width: var(--rgut);
  z-index: 30; pointer-events: none; }
.railsq { position: sticky; top: 0; pointer-events: auto; width: var(--rgut);
  background: var(--dark); display: flex; flex-direction: column; align-items: stretch;
  padding: 30px 20px 22px; gap: 22px; }
.railsq .rtag { width: 132px; display: block; margin: 0 auto; }
.railsq .rdemo { display: flex; align-items: center; justify-content: center; height: 44px;
  margin-top: auto; background: #fff; color: var(--dark); font-size: 14px; font-weight: 600;
  letter-spacing: -0.012em; border-radius: var(--radius-pill); }

/* ═══════════ HERO ═══════════
   Vertical gradient, indigo at the nav falling through violet and rose to
   the canvas. Flat left to right, so the type sits on an even field. */
.hero3 { position: relative; height: 930px; overflow: hidden; }
.hero3 .g3 { position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(180deg,
    #2e2f80 0%, #313080 6%, #423480 18%, #55397e 30%, #6b3c77 42%,
    #783c71 48%, #8d3f67 60%, #944565 66%, #944b5e 72%, #6f3e44 78%,
    #452a2a 84%, #1b1210 90%, #0d0a16 97%); }

.hero3 h1 { position: absolute; left: var(--pad); top: 62px; z-index: 3;
  font-size: 200px; line-height: 0.86; letter-spacing: -0.052em; }
.hero3 .lede { position: absolute; left: var(--pad); top: 393px; z-index: 3; width: 440px;
  font-size: 36px; font-weight: 700; line-height: 1.25; letter-spacing: -0.014em; color: #fff; }
.hero3 .body { position: absolute; left: var(--pad); top: 521px; z-index: 3; width: 349px;
  font-size: 24px; font-weight: 700; line-height: 1.34; color: rgba(255,255,255,0.90); }
.hero3 .ctas { position: absolute; left: var(--pad); top: 736px; z-index: 3; display: flex; gap: 12px; }
.hero3 .ctas .btn { height: 45px; padding: 0 26px; }

/* ── the cropped components ──
   One dashboard image behind every window. Each window shows a single
   panel, scaled so the panel fills the card and clips at the card edge.
   Geometry is three numbers per card: width sets the zoom, left and top
   set the pan.

   The row runs slowly to the left and loops, so a visitor who stays on
   the page sees the whole set rather than the same three. The strip is
   cut short of the text column and fades at that edge. */
.strip { position: absolute; left: 500px; right: 0; top: 349px; height: 360px; z-index: 3;
  overflow: hidden;
  /* The fade reaches full exactly where the first card starts, so nothing
     is faded at rest and a card only softens once it moves past it. */
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 72px);
  mask-image: linear-gradient(90deg, transparent 0, #000 72px); }
.track { position: absolute; left: 72px; top: 0; display: flex; gap: 26px; }
/* No shadow. The cards sit flat on the gradient in Figma, hard edge, and
   a soft one under them muddies the field they are sitting on. */
.pcard { width: 332px; height: 338px; flex: none; position: relative; overflow: hidden;
  background: #f9fafc; border-radius: var(--radius-sm); }
.pcard img { position: absolute; width: 1107px; max-width: none; }
/* row one of the dashboard */
.pcard.p1 img { left: -35px;  top: -137px; }
.pcard.p2 img { left: -388px; top: -137px; }
.pcard.p3 img { left: -741px; top: -137px; }
/* row two */
.pcard.p4 img { left: -35px;  top: -501px; }
.pcard.p5 img { left: -388px; top: -501px; }
.pcard.p6 img { left: -741px; top: -501px; }

/* The row is static. The full set is in the markup so the track is ready
   to slide left on scroll when Groundwrk builds it. One set is six cards
   at 332 plus six 26px gaps, so travelling 2148px puts card seven where
   card one was and the loop has no seam. */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="hp">

  <!-- ═══ the sticky rail ═══ -->
  <div class="railgutter">
    <aside class="railsq">
      <img class="rtag" src="img/unpack-possible-white.svg" alt="Unpack possible">
      <a class="rdemo" href="#">Book a demo</a>
    </aside>
  </div>

  <!-- ═══ NAV ═══ -->
  <nav class="nav">
    <img class="mark" src="img/campminder-logo-white.svg" alt="Campminder">
    <div class="links">
      <a href="#">Features</a><a href="#">Solutions</a><a href="#">Demo</a><a href="#">Company</a>
    </div>
    <div class="right">
      <a class="login" href="#">Log in</a>
      <a class="btn solid" href="#">Book a demo</a>
    </div>
  </nav>

  <!-- ═══ HERO ═══ -->
  <section class="hero3">
    <div class="g3"></div>
    <h1>One for all.</h1>
    <p class="lede">The trusted platform for everyone at your camp.</p>
    <p class="body">Registration, staffing, health, communication, and the business behind it all.</p>
    <div class="ctas">
      <a class="btn solid" href="#">Book a demo</a>
      <a class="btn line" href="#">See the platform</a>
    </div>

    <!-- The set runs twice so the loop always has cards on both sides of
         the strip. The second set is decorative and hidden from readers. -->
    <div class="strip">
      <div class="track">
        <div class="pcard p1"><img src="img/shot-enrollment-dashboard.png" alt="Enrollment, campers and leads conversion"></div>
        <div class="pcard p2"><img src="img/shot-enrollment-dashboard.png" alt="Session breakdown, enrollment by program"></div>
        <div class="pcard p3"><img src="img/shot-enrollment-dashboard.png" alt="Year over year enrollment pace"></div>
        <div class="pcard p4"><img src="img/shot-enrollment-dashboard.png" alt="Leads for the 2027 season"></div>
        <div class="pcard p5"><img src="img/shot-enrollment-dashboard.png" alt="New enrollments as they come in"></div>
        <div class="pcard p6"><img src="img/shot-enrollment-dashboard.png" alt="Camper loyalty and years attended"></div>
        <div class="pcard p1" aria-hidden="true"><img src="img/shot-enrollment-dashboard.png" alt=""></div>
        <div class="pcard p2" aria-hidden="true"><img src="img/shot-enrollment-dashboard.png" alt=""></div>
        <div class="pcard p3" aria-hidden="true"><img src="img/shot-enrollment-dashboard.png" alt=""></div>
        <div class="pcard p4" aria-hidden="true"><img src="img/shot-enrollment-dashboard.png" alt=""></div>
        <div class="pcard p5" aria-hidden="true"><img src="img/shot-enrollment-dashboard.png" alt=""></div>
        <div class="pcard p6" aria-hidden="true"><img src="img/shot-enrollment-dashboard.png" alt=""></div>
      </div>
    </div>
  </section>

</div>
</body>
</html>
